    <script>
      // Safeguard for environments (sandboxed iframes, preview tools) where window.fetch is a getter-only property
      (function() {
        try {
          var nativeFetch = null;
          try {
            if (typeof window !== 'undefined' && window.fetch) {
              nativeFetch = window.fetch.bind(window);
            }
          } catch (_) {}

          var currentFetch = nativeFetch;
          var fetchAccessor = {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          };

          // 1. Define on Window.prototype (where getter-only attribute originates in WebIDL)
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', fetchAccessor);
            }
          } catch (_) {}

          // 2. Define on window instance
          try {
            if (typeof window !== 'undefined') {
              Object.defineProperty(window, 'fetch', fetchAccessor);
            }
          } catch (_) {}

          // 3. Define on globalThis
          try {
            if (typeof globalThis !== 'undefined') {
              Object.defineProperty(globalThis, 'fetch', fetchAccessor);
            }
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
