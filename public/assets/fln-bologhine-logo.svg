<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <radialGradient id="sun-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <linearGradient id="torch-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flag-pole" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="400" cy="400" r="390" fill="#ffffff" />
  
  <!-- Outer Double Red Border Rings -->
  <circle cx="400" cy="400" r="382" fill="none" stroke="#a81c24" stroke-width="14" />
  <circle cx="400" cy="400" r="366" fill="none" stroke="#a81c24" stroke-width="3.5" />
  
  <!-- Left Side Crescent Ribbon Accent (matching official design) -->
  <path d="M 120 280 C 80 340 75 440 110 520 C 80 440 85 350 120 280 Z" fill="#a81c24" />

  <!-- ========================================== -->
  <!-- TOP EMBRACING HANDS (Left & Right)          -->
  <!-- ========================================== -->
  <!-- Left Arm & Hand -->
  <g fill="none" stroke="#d62246" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm wrist cuff -->
    <path d="M 80 380 Q 110 395 140 405" stroke-width="7" />
    <path d="M 72 410 Q 105 425 135 435" stroke-width="7" />
    <path d="M 72 410 Q 75 395 80 380" stroke-width="6" />
    
    <!-- Forearm leading to palm -->
    <path d="M 135 435 Q 165 445 180 440 Q 210 390 190 310 Q 170 240 215 180" stroke-width="7" fill="#fdf2f4" />
    <!-- Fingers reaching towards top emblem -->
    <path d="M 215 180 Q 235 150 260 170 Q 250 200 230 215" />
    <path d="M 260 170 Q 285 175 285 200 Q 260 215 240 225" />
    <path d="M 285 200 Q 295 220 275 235 Q 255 240 230 245" />
    <path d="M 275 235 Q 265 260 235 265" />
    <!-- Palm inner crease -->
    <path d="M 200 240 Q 230 255 245 285" stroke-dasharray="2,3" stroke-width="3" />
  </g>

  <!-- Right Arm & Hand -->
  <g fill="none" stroke="#d62246" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm wrist cuff -->
    <path d="M 720 380 Q 690 395 660 405" stroke-width="7" />
    <path d="M 728 410 Q 695 425 665 435" stroke-width="7" />
    <path d="M 728 410 Q 725 395 720 380" stroke-width="6" />
    
    <!-- Forearm leading to palm -->
    <path d="M 665 435 Q 635 445 620 440 Q 590 390 610 310 Q 630 240 585 180" stroke-width="7" fill="#fdf2f4" />
    <!-- Fingers reaching towards top emblem -->
    <path d="M 585 180 Q 565 150 540 170 Q 550 200 570 215" />
    <path d="M 540 170 Q 515 175 515 200 Q 540 215 560 225" />
    <path d="M 515 200 Q 505 220 525 235 Q 545 240 570 245" />
    <path d="M 525 235 Q 535 260 565 265" />
    <!-- Palm inner crease -->
    <path d="M 600 240 Q 570 255 555 285" stroke-dasharray="2,3" stroke-width="3" />
  </g>


  <!-- ========================================== -->
  <!-- CENTRAL FLN EMBLEM MEDALLION               -->
  <!-- ========================================== -->
  <g transform="translate(400, 240)">
    <!-- Medallion Outer Circle -->
    <circle cx="0" cy="0" r="162" fill="#ffffff" stroke="#111827" stroke-width="7" />
    <circle cx="0" cy="0" r="150" fill="#ffffff" stroke="#111827" stroke-width="2.5" />

    <!-- Top Calligraphy Arc: حزب جبهة التحرير الوطني -->
    <path id="top-arc" d="M -135 -30 A 138 138 0 0 1 135 -30" fill="none" stroke="none" />
    <text font-family="'Cairo', 'Amiri', Arial, sans-serif" font-weight="900" font-size="33" fill="#111827">
      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
        حزب جبهة التحرير الوطني
      </textPath>
    </text>

    <!-- Side Stars ★ -->
    <text x="-128" y="10" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">★</text>
    <text x="128" y="10" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">★</text>

    <!-- Bottom Oath Arc: جبهة التحرير اعطيناك عهدا -->
    <path id="bottom-arc" d="M -135 20 A 136 136 0 0 0 135 20" fill="none" stroke="none" />
    <text font-family="'Cairo', 'Amiri', Arial, sans-serif" font-weight="800" font-size="26" fill="#111827">
      <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
        جبهة التحرير أعطيناك عهدا
      </textPath>
    </text>

    <!-- Inner Core Circle -->
    <circle cx="0" cy="-5" r="94" fill="#ffffff" stroke="#111827" stroke-width="4" />

    <!-- Radiating Sun Rays in Golden Yellow -->
    <g stroke="#d97706" stroke-width="2.5">
      <line x1="0" y1="-8" x2="0" y2="-88" />
      <line x1="0" y1="-8" x2="-25" y2="-84" />
      <line x1="0" y1="-8" x2="25" y2="-84" />
      <line x1="0" y1="-8" x2="-48" y2="-74" />
      <line x1="0" y1="-8" x2="48" y2="-74" />
      <line x1="0" y1="-8" x2="-68" y2="-58" />
      <line x1="0" y1="-8" x2="68" y2="-58" />
      <line x1="0" y1="-8" x2="-82" y2="-36" />
      <line x1="0" y1="-8" x2="82" y2="-36" />
      <line x1="0" y1="-8" x2="-88" y2="-12" />
      <line x1="0" y1="-8" x2="88" y2="-12" />
    </g>

    <!-- Flame of the Revolution at Top -->
    <path d="M 0 -88 C -14 -68 -16 -50 0 -36 C 16 -50 14 -68 0 -88 Z" fill="url(#torch-gradient)" />
    <path d="M 0 -72 C -6 -58 -8 -48 0 -40 C 8 -48 6 -58 0 -72 Z" fill="#fef08a" />

    <!-- Left Cogwheel (Industry) -->
    <path d="M -82 0 C -82 40 -50 78 0 82 L 0 62 C -35 58 -62 30 -62 0 Z" fill="#047857" />
    <g fill="#047857">
      <rect x="-86" y="-10" width="10" height="8" rx="2" transform="rotate(-15 -81 -6)" />
      <rect x="-84" y="14" width="10" height="8" rx="2" transform="rotate(10 -79 18)" />
      <rect x="-76" y="36" width="10" height="8" rx="2" transform="rotate(35 -71 40)" />
      <rect x="-60" y="56" width="10" height="8" rx="2" transform="rotate(55 -55 60)" />
    </g>

    <!-- Right Olive/Laurel Branch (Peace) -->
    <path d="M 0 82 C 50 78 82 40 82 0" fill="none" stroke="#047857" stroke-width="4.5" />
    <g fill="#047857">
      <ellipse cx="68" cy="12" rx="9" ry="5" transform="rotate(-20 68 12)" />
      <ellipse cx="75" cy="28" rx="9" ry="5" transform="rotate(-35 75 28)" />
      <ellipse cx="64" cy="46" rx="9" ry="5" transform="rotate(-50 64 46)" />
      <ellipse cx="48" cy="62" rx="9" ry="5" transform="rotate(-65 48 62)" />
      <ellipse cx="28" cy="74" rx="9" ry="5" transform="rotate(-80 28 74)" />
    </g>

    <!-- Central Green Hands Holding the Algerian Flag / Crescent -->
    <g fill="#047857">
      <!-- Left Hand Reaching Up -->
      <path d="M -44 35 C -44 10 -22 -15 -12 -28 C -6 -18 -8 15 -14 38 Z" />
      <!-- Right Hand Reaching Up -->
      <path d="M 44 35 C 44 10 22 -15 12 -28 C 6 -18 8 15 14 38 Z" />
      <path d="M -22 38 Q 0 44 22 38 Q 0 54 -22 38 Z" />
    </g>

    <!-- Algerian Red Crescent and Five-Pointed Star -->
    <g transform="translate(0, -10)">
      <circle cx="0" cy="0" r="28" fill="#dc2626" />
      <circle cx="8" cy="0" r="23" fill="#ffffff" />
      <!-- Star -->
      <polygon points="12,-16 16,-4 28,-4 18,4 22,16 12,9 2,16 6,4 -4,-4 8,-4" fill="#dc2626" transform="translate(2, -2) scale(0.65)" />
    </g>
  </g>


  <!-- ========================================== -->
  <!-- LARGE CALLIGRAPHY: محافظة                   -->
  <!-- ========================================== -->
  <!-- "مـحـا" on the right side -->
  <g fill="#047857" font-family="'Cairo', Arial, sans-serif">
    <!-- Stylized Arabic Calligraphy Path for "محافظة" -->
    <!-- 'مـحـا' Segment -->
    <path d="M 680 500 C 650 495 620 485 580 480 C 560 478 540 485 530 505 L 530 535 C 570 535 630 540 680 535 C 700 535 715 515 700 502 Z" />
    <path d="M 680 430 Q 730 460 740 500 Q 720 520 680 515 Q 670 470 650 445 Z" />
    
    <!-- Letter 'ظ' (Zha) -->
    <path d="M 285 470 L 285 420 L 255 420 L 255 475 C 220 480 180 495 160 515 C 150 528 165 540 185 540 C 230 540 310 535 345 530 L 345 495 C 320 485 295 480 285 470 Z" />
    <!-- Point for Zha -->
    <circle cx="270" cy="395" r="14" fill="#047857" />

    <!-- 'ة' (Ta Marbuta) at far left -->
    <path d="M 155 530 C 130 530 100 520 100 485 C 100 450 135 435 165 445 C 180 452 185 475 175 495 L 140 495 C 135 475 125 475 125 485 C 125 498 135 505 155 505 Z" />
    <!-- Two Dots for Ta Marbuta -->
    <circle cx="135" cy="425" r="10" fill="#047857" />
    <circle cx="160" cy="425" r="10" fill="#047857" />
  </g>

  <!-- ========================================== -->
  <!-- "Fa" (ف) Loop with ALGERIAN REVOLUTION FLAG -->
  <!-- ========================================== -->
  <g transform="translate(425, 490)">
    <!-- The Loop of letter 'Fa' forming an oval frame -->
    <path d="M -90 45 C -90 -35 85 -35 85 45 C 85 65 -90 65 -90 45 Z" fill="#ffffff" stroke="#047857" stroke-width="22" />

    <!-- Inside the loop: Rocky Mountain Base in Crimson/Dark Red -->
    <path d="M -70 42 Q -40 25 -10 32 Q 25 20 65 42 Z" fill="#991b1b" />

    <!-- Silhouettes of Algerian Freedom Fighters (Mujahideen) in Crimson -->
    <g fill="#991b1b">
      <!-- Mujahid 1 holding the flag -->
      <circle cx="-15" cy="5" r="7" />
      <path d="M -22 12 L -8 12 L -4 30 L -18 30 Z" />
      <!-- Mujahid 2 with rifle -->
      <circle cx="10" cy="10" r="6" />
      <path d="M 4 16 L 16 16 L 18 32 L 6 32 Z" />
      <line x1="16" y1="16" x2="26" y2="2" stroke="#991b1b" stroke-width="3" />
      <!-- Mujahid 3 rallying -->
      <circle cx="35" cy="15" r="6" />
      <path d="M 28 20 L 40 20 L 45 35 L 26 35 Z" />
    </g>

    <!-- Algerian Flag on Flagpole -->
    <!-- Flagpole -->
    <line x1="-12" y1="25" x2="-45" y2="-55" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <circle cx="-45" cy="-55" r="4" fill="#d97706" />

    <!-- Waving Algerian Flag -->
    <g transform="translate(-45, -55) rotate(-15)">
      <!-- Green Half -->
      <path d="M 0 0 C 20 -8 30 5 45 -4 L 45 32 C 30 40 20 28 0 36 Z" fill="#047857" />
      <!-- White Half -->
      <path d="M 45 -4 C 60 -12 75 0 90 -8 L 90 28 C 75 36 60 24 45 32 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Red Crescent and Star in the middle -->
      <g transform="translate(45, 14) scale(0.42)">
        <circle cx="0" cy="0" r="16" fill="#dc2626" />
        <circle cx="4" cy="0" r="13" fill="#ffffff" />
        <polygon points="6,-9 8,-2 15,-2 9,2 11,9 6,5 1,9 3,2 -3,-2 4,-2" fill="#dc2626" transform="translate(1, -1)" />
      </g>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- LARGE CALLIGRAPHY: باب الوادي                -->
  <!-- ========================================== -->
  <g transform="translate(400, 615)">
    <!-- "باب" (Bab) on the right -->
    <g fill="#047857">
      <rect x="180" y="-45" width="22" height="65" rx="4" />
      <path d="M 70 20 L 202 20 L 202 -5 L 70 -5 Z" />
      <rect x="58" y="-45" width="22" height="65" rx="4" />
      <!-- Dots below 'Baa' -->
      <circle cx="136" cy="40" r="9" />
    </g>

    <!-- "الـ" of "الوادي" -->
    <g fill="#047857">
      <rect x="25" y="-48" width="22" height="68" rx="4" />
      <path d="M -5 20 L 45 20 L 45 -5 L -5 -5 Z" />
    </g>

    <!-- REVOLUTION TORCH REPLACING 'أ' (ALIF) -->
    <g transform="translate(-10, -5)">
      <!-- Torch Handle (Red & White FLN Torch) -->
      <path d="M -6 25 L 6 25 L 9 -15 L -9 -15 Z" fill="#b91c1c" />
      <path d="M -6 5 L 6 5 L 7 15 L -7 15 Z" fill="#ffffff" />
      <!-- Torch Bowl -->
      <path d="M -12 -15 L 12 -15 L 15 -28 L -15 -28 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2" />
      <!-- Red and Amber Torch Flame -->
      <path d="M 0 -72 C -14 -52 -18 -38 0 -28 C 18 -38 14 -52 0 -72 Z" fill="url(#torch-gradient)" />
      <path d="M 0 -58 C -7 -46 -9 -36 0 -30 C 9 -36 7 -46 0 -58 Z" fill="#fef08a" />
    </g>

    <!-- "ـوادي" (Wadi) on the left -->
    <g fill="#047857">
      <!-- 'Waw' (و) -->
      <circle cx="-50" cy="-22" r="18" fill="none" stroke="#047857" stroke-width="18" />
      <path d="M -40 -12 Q -55 20 -75 22" fill="none" stroke="#047857" stroke-width="18" stroke-linecap="round" />

      <!-- 'Alif' (ا) -->
      <rect x="-105" y="-48" width="20" height="68" rx="4" />

      <!-- 'Dal' (د) -->
      <path d="M -140 -40 L -140 18 L -185 18 L -185 -5 L -162 -5 L -162 -40 Z" />

      <!-- 'Yaa' (ي) with two dots -->
      <path d="M -195 -35 C -205 -45 -225 -45 -235 -30 C -245 -10 -215 10 -210 20 L -250 20 C -255 5 -250 -5 -245 -15 L -230 -15 C -225 -2 -215 -5 -220 -20 Z" />
      <!-- Dots for Yaa -->
      <circle cx="-215" cy="42" r="9" />
      <circle cx="-238" cy="42" r="9" />
    </g>
  </g>


  <!-- ========================================== -->
  <!-- LOWER BANNER: قِسْمَةُ بُولُوغِينْ            -->
  <!-- ========================================== -->
  <g transform="translate(400, 715)">
    <!-- Left Small Green Welcoming Hand -->
    <g fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-200, 0)">
      <path d="M -25 -15 Q -10 -25 5 -10 Q 15 0 25 15" />
      <path d="M 0 -15 Q 12 -20 20 -5" />
      <path d="M 8 -8 Q 18 -12 24 5" />
      <path d="M -20 -5 Q -10 10 5 22" />
      <path d="M -28 -8 Q -30 10 -15 20" />
    </g>

    <!-- Right Small Green Welcoming Hand -->
    <g fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(200, 0) scale(-1, 1)">
      <path d="M -25 -15 Q -10 -25 5 -10 Q 15 0 25 15" />
      <path d="M 0 -15 Q 12 -20 20 -5" />
      <path d="M 8 -8 Q 18 -12 24 5" />
      <path d="M -20 -5 Q -10 10 5 22" />
      <path d="M -28 -8 Q -30 10 -15 20" />
    </g>

    <!-- Calligraphy: قِسْمَةُ بُولُوغِينْ (with full tashkeel/diacritics) -->
    <text x="0" y="5" font-family="'Cairo', 'Amiri', Arial, sans-serif" font-weight="900" font-size="44" fill="#047857" text-anchor="middle">
      قِسْمَةُ بُولُوغِينْ
    </text>

    <!-- Traditional Calligraphic Florals and Flourishes below -->
    <path d="M -130 24 Q 0 34 130 24" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="29" r="4.5" fill="#047857" />
  </g>
</svg>
